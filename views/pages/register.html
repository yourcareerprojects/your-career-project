<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Career Puzzle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #response {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
        .password-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-group input {
            margin-bottom: 0;
            flex-grow: 1;
        }
        .toggle-password {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: #666;
            position: absolute;
            right: 8px;
        }
        .toggle-password:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Register New User</h1>
    <form id="registerForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <div class="password-group">
                <input type="password" id="password" name="password" required minlength="8">
                <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
            </div>
        </div>
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
        </div>
        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="16">
        </div>
        <div class="form-group">
            <label for="location">Location:</label>
            <input type="text" id="location" name="location">
        </div>
        <button type="submit">Register</button>
    </form>
    <div id="response"></div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.textContent = '🔒';
            } else {
                passwordInput.type = 'password';
                toggleButton.textContent = '👁️';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                personalInfo: {
                    name: document.getElementById('name').value,
                    age: parseInt(document.getElementById('age').value) || undefined,
                    location: document.getElementById('location').value
                }
            };

            try {
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                const responseDiv = document.getElementById('response');
                
                if (response.ok) {
                    responseDiv.className = 'success';
                    responseDiv.textContent = 'Registration successful! User created: ' + JSON.stringify(data.user, null, 2);
                } else {
                    responseDiv.className = 'error';
                    responseDiv.textContent = 'Error: ' + data.message;
                }
            } catch (error) {
                const responseDiv = document.getElementById('response');
                responseDiv.className = 'error';
                responseDiv.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
